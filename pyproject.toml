[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feel-lang"
version = "0.1.0"
description = "Pure-Python, MIT-licensed FEEL expression evaluator and decision tables for DMN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "feel-lang contributors" }]
keywords = ["feel", "dmn", "decision-table", "business-rules", "expression-language"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "twine>=6.1"]

[project.scripts]
feel-lang = "feel_lang.cli:main"

[project.urls]
Homepage = "https://github.com/maxico714/feel-lang"
Issues = "https://github.com/maxico714/feel-lang/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feel_lang = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
